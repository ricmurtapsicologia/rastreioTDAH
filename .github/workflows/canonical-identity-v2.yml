name: Canonical Identity v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-identity-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical identity fields safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- Blocos -->'
          if marker not in s:
              raise SystemExit('QUESTION_MARKER_MISSING')
          before, protected=s.split(marker,1)
          original_protected=protected
          if 'id="birthDate"' not in before:
              needle='''      <div class="field">\n        <label for="date">Data</label>\n        <input type="date" id="date" required>\n      </div>'''
              replacement='''      <div class="field">\n        <label for="birthDate">Data de nascimento</label>\n        <input type="date" id="birthDate" required>\n      </div>\n      <div class="field">\n        <label for="date">Data de aplicação do rastreio</label>\n        <input type="date" id="date" required>\n      </div>'''
              if needle not in before:
                  raise SystemExit('IDENTITY_BLOCK_NOT_FOUND')
              before=before.replace(needle,replacement,1)
          out=before+marker+protected
          if out.split(marker,1)[1] != original_protected:
              raise SystemExit('QUESTION_CONTENT_CHANGED')
          p.write_text(out,encoding='utf-8')
          PY
      - name: Validate identity and questionnaire preservation
        shell: bash
        run: |
          grep -q 'id="name"' index.html
          grep -q 'id="birthDate"' index.html
          grep -q 'id="date"' index.html
          grep -q 'Data de aplicação do rastreio' index.html
          grep -q '<!-- Blocos -->' index.html
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona identificação canônica ao rastreio TDAH'
          git push
